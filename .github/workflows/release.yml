name: Auto Release

# Automatic SemVer release on every merge to main.
#
# On each push to main we look at the commit(s) merged since the last release
# tag and decide the next version from Conventional Commits:
#   feat:            -> minor
#   fix:/chore:/…    -> patch
#   type!: / BREAKING -> major
# (see scripts/release-version.mjs). The three version files are bumped via the
# existing `npm version` lifecycle, committed back as `chore(release): x.y.z`,
# tagged (bare tag, no "v" prefix — Obsidian requires this), built, and published
# as a GitHub Release with the three required assets.
#
# The commit we push back is itself skipped by the loop guard, so this never
# recurses. Pushing with GITHUB_TOKEN also does not re-trigger workflows; the
# guard additionally covers the PAT (RELEASE_TOKEN) case.

on:
  push:
    branches: [main]
  workflow_dispatch: {} # allow a manual run from the Actions tab

concurrency:
  # Renamed from "auto-release" on purpose. On 2026-08-06 a GitHub runner outage
  # left the push-triggered run for #20 stuck in "queued" forever; because it sat
  # in the concurrency group with cancel-in-progress:false, the automatic release
  # for later merges (#22, #23) had to be kicked off by hand. A fresh group name
  # sidesteps that orphaned run (it lives in the old group) so pushes to main
  # auto-release again, while the job timeout below stops any single run from
  # hanging indefinitely.
  group: auto-release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # A release run is short (build + publish). Cap it so a hung step can never
    # occupy the concurrency group the way the 2026-08-06 outage did.
    timeout-minutes: 20
    permissions:
      contents: write # create the release + push the version-bump commit
      id-token: write # mint the OIDC token Sigstore uses to sign the attestation
      attestations: write # persist the build-provenance attestation

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so we can find the range since the last release,
          # and a token that is allowed to push the release commit back to main.
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Loop guard — skip our own release commits
        id: guard
        run: |
          subject="$(git log -1 --pretty=%s)"
          echo "HEAD subject: $subject"
          if printf '%s' "$subject" | grep -qiE '^chore\(release\):'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "This is a release commit — nothing to do."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Use Node.js
        if: steps.guard.outputs.skip == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Determine commit range since the last release tag
        id: range
        if: steps.guard.outputs.skip == 'false'
        run: |
          last="$(git tag --sort=-v:refname | head -n1)"
          if [ -n "$last" ]; then
            echo "Last release tag: $last"
            echo "range=$last..HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "No prior release tag — considering full history."
            echo "range=HEAD" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute next version from Conventional Commits
        id: version
        if: steps.guard.outputs.skip == 'false'
        run: |
          # NUL-separate each commit's full message so multi-line bodies (and
          # BREAKING CHANGE footers) reach the classifier intact.
          git log ${{ steps.range.outputs.range }} --pretty=format:'%B%x00' \
            | node scripts/release-version.mjs
          echo # newline after the script's bare-value stdout

      - name: Report decision
        if: steps.guard.outputs.skip == 'false'
        run: |
          echo "release=${{ steps.version.outputs.release }}"
          echo "level=${{ steps.version.outputs.level }}"
          echo "version=${{ steps.version.outputs.version }}"

      - name: Apply version bump (package.json + manifest.json + versions.json)
        if: steps.guard.outputs.skip == 'false' && steps.version.outputs.release == 'true'
        run: |
          npm ci
          # `npm version` runs the repo's `version` lifecycle (version-bump.mjs),
          # which syncs manifest.json + versions.json. --no-git-tag-version keeps
          # git untouched; we commit and tag explicitly below.
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version

      - name: Build plugin
        if: steps.guard.outputs.skip == 'false' && steps.version.outputs.release == 'true'
        run: npm run build

      - name: Mobile-safety guard (no Node built-in require in the bundle)
        if: steps.guard.outputs.skip == 'false' && steps.version.outputs.release == 'true'
        run: npm run check:bundle

      - name: Attest build provenance of the release assets
        if: steps.guard.outputs.skip == 'false' && steps.version.outputs.release == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          # Lets users cryptographically verify these assets were built from this
          # repo by this workflow (the Obsidian review flags assets without it).
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Commit and push the release
        if: steps.guard.outputs.skip == 'false' && steps.version.outputs.release == 'true'
        run: |
          v="${{ steps.version.outputs.version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json manifest.json versions.json
          git commit -m "chore(release): ${v}"
          git push origin HEAD:main

      - name: Create GitHub Release
        if: steps.guard.outputs.skip == 'false' && steps.version.outputs.release == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ steps.version.outputs.version }}"
          # Bare version tag (no "v" prefix). gh creates the tag at the release
          # commit we just pushed. Re-running for an existing version is a no-op.
          if gh release view "$v" >/dev/null 2>&1; then
            echo "Release $v already exists — skipping."
          else
            gh release create "$v" \
              --title="$v" \
              --target="$(git rev-parse HEAD)" \
              --generate-notes \
              main.js manifest.json styles.css
          fi
