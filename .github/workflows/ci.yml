name: CI

# Runs on PULL REQUESTS, not on every feature-branch push.
#
# `pull_request` fires on opened/reopened/synchronize, so a branch is checked from
# the moment a PR exists and re-checked on every push to it — while work in
# progress on a branch with no PR costs nothing. It also removes the duplicate run
# a PR branch used to get (once for the push, once for the PR).
#
# `push: main` stays deliberately: release.yml publishes a GitHub Release on every
# push to main and only runs `npm run build` — no lint, no tests. Without this
# trigger nothing would check the merge result before it ships.
on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - run: npm ci

      - name: Lint (eslint — obsidianmd + typescript-eslint type-checked)
        run: npm run lint

      - name: Lint CSS (Obsidian browser-feature support)
        run: npm run lint:css

      - name: Type check
        run: npx tsc --noEmit --skipLibCheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Mobile-safety guard (no Node built-in require in the bundle)
        run: npm run check:bundle
